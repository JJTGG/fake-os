<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="taskbar">
  <button id="start-btn">Start</button>
  <div id="clock"></div>
</div>

<div id="start-menu" class="hidden">
  <ul id="app-list">
    <li data-app="notes">Notes</li>
    <li data-app="calculator">Calculator</li>
    <li data-app="files">Files</li>
    <li data-app="settings">Settings</li>
  </ul>
</div>

<div id="notes-window" class="app-window hidden">
  <div class="window-header">
    <span>Notes</span>
    <button class="close-btn">×</button>
  </div>
  <div class="window-body">
    Notes content goes here
  </div>
</div>

<div id="calculator-window" class="app-window hidden">
  <div class="window-header">
    <span>Calculator</span>
    <button class="close-btn">×</button>
  </div>
  <div class="window-body">
    <input type="text" id="calc-display" readonly>
    <div id="calc-buttons">
      <button data-val="7">7</button>
      <button data-val="8">8</button>
      <button data-val="9">9</button>
      <button data-val="/">÷</button>
      <button data-val="4">4</button>
      <button data-val="5">5</button>
      <button data-val="6">6</button>
      <button data-val="*">×</button>
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button data-val="-">−</button>
      <button data-val="0">0</button>
      <button data-val=".">.</button>
      <button data-val="=" id="calc-equals">=</button>
      <button data-val="+">+</button>
    </div>
    <button id="calc-clear">Clear</button>
  </div>
</div>

<div id="files-window" class="app-window hidden">
  <div class="window-header">
    <span>Files</span>
    <button class="close-btn">×</button>
  </div>
  <div class="window-body">
    <button id="files-back" class="hidden">← Back</button>
    <ul id="files-list"></ul>
  </div>
</div>

<div id="settings-window" class="app-window hidden">
  <div class="window-header">
    <span>Settings</span>
    <button class="close-btn">×</button>
  </div>
  <div class="window-body">
    <label><input type="checkbox" id="toggle-dark"> Dark mode</label><br>
    <label><input type="checkbox" id="toggle-24h"> 24-hour clock</label><br>
    <label><input type="checkbox" id="toggle-drag" checked> Enable window dragging</label>
  </div>
</div>
</body>
<script src="script.js"></script>
</html>
